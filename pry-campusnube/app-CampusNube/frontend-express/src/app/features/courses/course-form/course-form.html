<form [formGroup]="form" (ngSubmit)="submit()" class="form-container">
  <div class="field">
    <label for="name">Nombre del curso</label>
    <input
      pInputText
      id="name"
      formControlName="name"
      placeholder="Ingrese el nombre del curso"
    />

    @if (form.controls.name.touched && form.controls.name.invalid) {
      <small class="error">El nombre es obligatorio y debe tener máximo 120 caracteres.</small>
    }
  </div>

  <div class="field">
    <label for="description">Descripción</label>
    <textarea
      pTextarea
      id="description"
      formControlName="description"
      rows="3"
      placeholder="Descripción del curso"
    ></textarea>
  </div>

  <div class="field">
    <label for="teachers">Docentes</label>
    <p-multiselect
      inputId="teachers"
      [options]="teachers()"
      optionLabel="name"
      optionValue="id"
      formControlName="teacherIds"
      placeholder="Seleccione los docentes"
      display="chip"
      class="w-full"
    />
  </div>

  <div class="form-actions">
    <p-button
      label="Cancelar"
      severity="secondary"
      [outlined]="true"
      type="button"
      (onClick)="cancelled.emit()"
    />

    <p-button
      label="Guardar"
      type="submit"
      [loading]="saving()"
      [disabled]="saving()"
    />
  </div>
</form>
