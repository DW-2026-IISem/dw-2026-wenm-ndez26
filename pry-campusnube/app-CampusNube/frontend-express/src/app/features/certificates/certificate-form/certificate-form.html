<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="flex flex-column gap-3"
>
  @if (errorMessage) {
    <p-message severity="error">
      {{ errorMessage }}
    </p-message>
  }

  <div class="flex flex-column gap-2">
    <label for="enrollment_id">Inscripción</label>

    <p-select
      inputId="enrollment_id"
      formControlName="enrollment_id"
      [options]="enrollmentOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Selecciona una inscripción activa"
      [filter]="true"
      [showClear]="true"
      class="w-full"
    />

    @if (
      form.controls.enrollment_id.touched &&
      form.controls.enrollment_id.invalid
    ) {
      <small class="text-red-500">
        Debes seleccionar una inscripción.
      </small>
    }
  </div>

  <div class="flex flex-column gap-2">
    <label for="name">Nombre del certificado</label>

    <input
      id="name"
      pInputText
      formControlName="name"
      maxlength="255"
      placeholder="Escribe el nombre del certificado"
      class="w-full"
    />

    @if (form.controls.name.touched && form.controls.name.invalid) {
      <small class="text-red-500">
        El nombre es obligatorio y no debe superar 255 caracteres.
      </small>
    }
  </div>

  <div class="flex flex-column gap-2">
    <label for="description">Descripción</label>

    <textarea
      id="description"
      pTextarea
      formControlName="description"
      rows="4"
      placeholder="Descripción del certificado"
      class="w-full"
    ></textarea>
  </div>

  <div class="flex justify-content-end gap-2">
    <p-button
      type="button"
      label="Cancelar"
      severity="secondary"
      [outlined]="true"
      (onClick)="cancel()"
    />

    <p-button
      type="submit"
      [label]="certificate ? 'Actualizar' : 'Guardar'"
      icon="pi pi-save"
      [loading]="loading"
      [disabled]="loading"
    />
  </div>
</form>
