<section aria-labelledby="roles-permissions-title">
  <h1 id="roles-permissions-title">Roles y permisos</h1>

  <nav class="mb-4 flex flex-wrap gap-4" aria-label="Roles y permisos">
    @for (resource of resources(); track resource.path) {
      <a
        class="underline"
        [routerLink]="resource.path"
        routerLinkActive="font-bold"
        ariaCurrentWhenActive="page"
      >
        {{ resource.label }}
      </a>
    } @empty {
      <p>No tienes acceso a Asignaciones ni a Concesiones.</p>
    }
  </nav>

  <router-outlet />
</section>
