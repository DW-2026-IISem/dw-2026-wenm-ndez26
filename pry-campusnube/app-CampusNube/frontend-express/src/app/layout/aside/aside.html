<div class="flex h-full flex-col border-r border-slate-200 bg-white text-slate-900">

  <div class="flex-1 overflow-y-auto p-3">
    <nav class="campus-nav" aria-label="Navegación principal" (click)="onNavigationClick($event)">
      <p-panelmenu [model]="items()" [multiple]="true" />
    </nav>
  </div>

  @if (showSession()) {
    <div class="border-t border-slate-200 p-3">
      <details class="group">
        <summary
          class="flex cursor-pointer list-none items-center gap-3 rounded-xl p-3 transition-colors hover:bg-slate-50"
          aria-label="Opciones de usuario"
        >
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-teal-50 text-teal-700">
            <i class="pi pi-user text-lg"></i>
          </div>

          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-semibold text-slate-900">
              {{ username() || 'Invitado' }}
            </p>
            <p class="text-xs text-slate-500">
              {{ roleLabel() }} · {{ permissionCount() }} permisos
            </p>
          </div>

          <i class="pi pi-chevron-up text-xs text-slate-400 transition-transform group-open:rotate-180"></i>
        </summary>

        <div class="mt-2 space-y-1 px-2">
          <a
            routerLink="/perfil"
            (click)="navigated.emit()"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-50 hover:text-teal-700"
          >
            <i class="pi pi-user"></i>
            Mi perfil
          </a>

          <button
            type="button"
            pTooltip="Cerrar sesión"
            tooltipPosition="top"
            aria-label="Cerrar sesión"
            (click)="logoutRequested.emit()"
            class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm text-red-600 transition-colors hover:bg-red-50"
          >
            <i class="pi pi-sign-out"></i>
            Cerrar sesión
          </button>
        </div>
      </details>
    </div>
  }
</div>
